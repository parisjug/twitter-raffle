# Configuration file
# key = value
quarkus.ssl.native=true

# Bluesky API configuration (Quarkus 3.x format)
quarkus.rest-client.bluesky-api.url=https://bsky.social

# Mock mode - set to true to use mock data instead of real Bluesky API
# This is useful for UI testing and development without requiring credentials
# bluesky.mock.enabled=true

# Mock data file paths (used when bluesky.mock.enabled=true)
# By default, uses files from src/test/resources/bluesky-mocks/ to avoid duplication
# and allow direct use of files generated by the mock generator
# bluesky.mock.session.file=src/test/resources/bluesky-mocks/create-session-response.json
# bluesky.mock.search.file=src/test/resources/bluesky-mocks/search-response-with-images.json
